<div>
    <a class="internal-link" href="{{ site.baseurl }}/"><b>{{ site.title }}</b></a>
    {% if page.collection == "notes" and page.name != "index.md" %}
      {% assign subject = page.path | split: "/" | slice: 1, 1 | first %}
      {% if subject %}
        &gt; <a class="internal-link" href="{{ site.baseurl }}/{{ subject }}">{{ subject }}</a>
      {% endif %}
    {% endif %}
</div>
